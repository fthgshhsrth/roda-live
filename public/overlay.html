<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100e19"><title>BARATAS NA PISTA · LIVE 1080p</title>
<link rel="stylesheet" href="/overlay.css"></head><body>
<div id="backdrop"></div><div id="viewport"><canvas id="scene" aria-label="Festa de baratas dançando em 3D"></canvas></div>
<svg id="connectors" aria-hidden="true"></svg><div id="labels"></div>
<header class="live-header"><h1 id="sceneTitle">ARRAIÁ DAS BARATAS</h1><span class="scene-count"><strong id="count">0</strong> na festa</span><p id="sceneSubtitle" hidden></p></header>
<div id="finale" hidden><strong>🎆 NOVA FESTA!</strong><span id="finaleName"></span><small>Todos os papéis estão livres de novo.</small></div>
<div id="demoHint" hidden></div><div id="eventToast" aria-live="polite"></div>
<aside class="live-footer gift-sidebar"><div class="catalog-heading"><span>PRESENTES</span><small id="catalogStatus">Prévia · confirme ao conectar</small></div>
<div id="giftCatalog" class="gift-catalog" aria-label="Presentes e ações da festa"></div>
<div id="nowTrack" hidden><span class="equalizer"><i></i><i></i><i></i></span><span id="trackLabel"></span></div></aside>
<div id="windowTools"><button id="enable">♫ Ativar áudio</button><button id="fullscreen">⛶ Tela cheia</button><button id="quality">Qualidade: Full HD</button></div>
<div id="offline" hidden>Reconectando ao painel…</div><div id="boot" role="status">Acendendo a pista 3D…</div><audio id="audio" preload="auto"></audio>
<script>window.addEventListener('error',function(e){var b=document.getElementById('boot');b.hidden=false;b.textContent='Não foi possível abrir a cena 3D. Confira as dependências e a aceleração gráfica. '+(e.message||'');});</script>
<script type="module" src="/overlay.js"></script></body></html>
